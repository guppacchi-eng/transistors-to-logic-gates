<svg xmlns="http://www.w3.org/2000/svg" width="1150" height="1350" viewBox="0 0 1150 1350"><rect width="100%" height="100%" fill="white"/><style>text{font-family:Arial,sans-serif;fill:#17324d}.wire{stroke:#17324d;stroke-width:2;fill:none}.component{stroke:#17324d;stroke-width:2;fill:white}</style><text x="25" y="34" font-size="25">AND gate — complementary NPN + PNP transistors</text><text x="25" y="64" font-size="15">Supply: +3.3 V DC | NPN: 2N3904 | PNP: 2N3906 | Every base resistor: 10 kΩ</text><text x="25" y="88" font-size="14">Matching net labels connect electrically. All grounds connect to supply negative.</text><rect x="25" y="110" width="535" height="540" rx="8" fill="#f7fafc" stroke="#c5d4e0"/><text x="40" y="135" font-size="17">Stage 1: NA = NOT (A)</text><path d="M325,165 L325,188" class="wire"/><text x="340" y="175" font-size="15">+3.3 V</text><path d="M305,197 L305,243" class="wire"/><path d="M325,188 L305,208" class="wire"/><path d="M305,232 L325,252" class="wire"/><path d="M305,208 L319,202 L312,195 Z" fill="#17324d"/><text x="165" y="204" font-size="16">A</text><path d="M165,220 L200,220" class="wire"/><rect x="200" y="214" width="68" height="12" class="component"/><path d="M268,220 L305,220" class="wire"/><text x="202" y="245" font-size="12">10 kΩ</text><text x="337" y="215" font-size="13">Q1: PNP</text><text x="337" y="234" font-size="12">2N3906</text><path d="M325,252 L325,405" class="wire"/><path d="M210,405 L515,405" class="wire"/><circle cx="325" cy="405" r="3" fill="#17324d"/><text x="480" y="393" font-size="18">NA</text><circle cx="210" cy="405" r="3" fill="#17324d"/><path d="M210,405 L210,468" class="wire"/><path d="M190,477 L190,523" class="wire"/><path d="M210,468 L190,488" class="wire"/><path d="M190,512 L210,532" class="wire"/><path d="M210,532 L197,525 L205,518 Z" fill="#17324d"/><text x="50" y="484" font-size="16">A</text><path d="M50,500 L85,500" class="wire"/><rect x="85" y="494" width="68" height="12" class="component"/><path d="M153,500 L190,500" class="wire"/><text x="87" y="525" font-size="12">10 kΩ</text><text x="222" y="495" font-size="13">Q2: NPN</text><text x="222" y="514" font-size="12">2N3904</text><path d="M210,532 L210,585" class="wire"/><path d="M192,585 L228,585" class="wire"/><path d="M198,591 L222,591" class="wire"/><path d="M205,597 L215,597" class="wire"/><text x="193" y="623" font-size="12">GND</text><rect x="585" y="110" width="535" height="540" rx="8" fill="#f7fafc" stroke="#c5d4e0"/><text x="600" y="135" font-size="17">Stage 2: NB = NOT (B)</text><path d="M885,165 L885,188" class="wire"/><text x="900" y="175" font-size="15">+3.3 V</text><path d="M865,197 L865,243" class="wire"/><path d="M885,188 L865,208" class="wire"/><path d="M865,232 L885,252" class="wire"/><path d="M865,208 L879,202 L872,195 Z" fill="#17324d"/><text x="725" y="204" font-size="16">B</text><path d="M725,220 L760,220" class="wire"/><rect x="760" y="214" width="68" height="12" class="component"/><path d="M828,220 L865,220" class="wire"/><text x="762" y="245" font-size="12">10 kΩ</text><text x="897" y="215" font-size="13">Q3: PNP</text><text x="897" y="234" font-size="12">2N3906</text><path d="M885,252 L885,405" class="wire"/><path d="M770,405 L1075,405" class="wire"/><circle cx="885" cy="405" r="3" fill="#17324d"/><text x="1040" y="393" font-size="18">NB</text><circle cx="770" cy="405" r="3" fill="#17324d"/><path d="M770,405 L770,468" class="wire"/><path d="M750,477 L750,523" class="wire"/><path d="M770,468 L750,488" class="wire"/><path d="M750,512 L770,532" class="wire"/><path d="M770,532 L757,525 L765,518 Z" fill="#17324d"/><text x="610" y="484" font-size="16">B</text><path d="M610,500 L645,500" class="wire"/><rect x="645" y="494" width="68" height="12" class="component"/><path d="M713,500 L750,500" class="wire"/><text x="647" y="525" font-size="12">10 kΩ</text><text x="782" y="495" font-size="13">Q4: NPN</text><text x="782" y="514" font-size="12">2N3904</text><path d="M770,532 L770,585" class="wire"/><path d="M752,585 L788,585" class="wire"/><path d="M758,591 L782,591" class="wire"/><path d="M765,597 L775,597" class="wire"/><text x="753" y="623" font-size="12">GND</text><rect x="25" y="670" width="535" height="540" rx="8" fill="#f7fafc" stroke="#c5d4e0"/><text x="40" y="695" font-size="17">Stage 3: Y = NOT (NA OR NB)</text><path d="M325,725 L325,748" class="wire"/><text x="340" y="735" font-size="15">+3.3 V</text><path d="M305,757 L305,803" class="wire"/><path d="M325,748 L305,768" class="wire"/><path d="M305,792 L325,812" class="wire"/><path d="M305,768 L319,762 L312,755 Z" fill="#17324d"/><text x="165" y="764" font-size="16">NA</text><path d="M165,780 L200,780" class="wire"/><rect x="200" y="774" width="68" height="12" class="component"/><path d="M268,780 L305,780" class="wire"/><text x="202" y="805" font-size="12">10 kΩ</text><text x="337" y="775" font-size="13">Q5: PNP</text><text x="337" y="794" font-size="12">2N3906</text><path d="M325,812 L325,848" class="wire"/><path d="M305,857 L305,903" class="wire"/><path d="M325,848 L305,868" class="wire"/><path d="M305,892 L325,912" class="wire"/><path d="M305,868 L319,862 L312,855 Z" fill="#17324d"/><text x="165" y="864" font-size="16">NB</text><path d="M165,880 L200,880" class="wire"/><rect x="200" y="874" width="68" height="12" class="component"/><path d="M268,880 L305,880" class="wire"/><text x="202" y="905" font-size="12">10 kΩ</text><text x="337" y="875" font-size="13">Q6: PNP</text><text x="337" y="894" font-size="12">2N3906</text><path d="M325,912 L325,965" class="wire"/><path d="M210,965 L515,965" class="wire"/><circle cx="325" cy="965" r="3" fill="#17324d"/><text x="480" y="953" font-size="18">Y</text><circle cx="210" cy="965" r="3" fill="#17324d"/><path d="M210,965 L210,1028" class="wire"/><path d="M190,1037 L190,1083" class="wire"/><path d="M210,1028 L190,1048" class="wire"/><path d="M190,1072 L210,1092" class="wire"/><path d="M210,1092 L197,1085 L205,1078 Z" fill="#17324d"/><text x="50" y="1044" font-size="16">NA</text><path d="M50,1060 L85,1060" class="wire"/><rect x="85" y="1054" width="68" height="12" class="component"/><path d="M153,1060 L190,1060" class="wire"/><text x="87" y="1085" font-size="12">10 kΩ</text><text x="222" y="1055" font-size="13">Q7: NPN</text><text x="222" y="1074" font-size="12">2N3904</text><path d="M210,1092 L210,1145" class="wire"/><path d="M192,1145 L228,1145" class="wire"/><path d="M198,1151 L222,1151" class="wire"/><path d="M205,1157 L215,1157" class="wire"/><text x="193" y="1183" font-size="12">GND</text><circle cx="445" cy="965" r="3" fill="#17324d"/><path d="M445,965 L445,1028" class="wire"/><path d="M425,1037 L425,1083" class="wire"/><path d="M445,1028 L425,1048" class="wire"/><path d="M425,1072 L445,1092" class="wire"/><path d="M445,1092 L432,1085 L440,1078 Z" fill="#17324d"/><text x="285" y="1044" font-size="16">NB</text><path d="M285,1060 L320,1060" class="wire"/><rect x="320" y="1054" width="68" height="12" class="component"/><path d="M388,1060 L425,1060" class="wire"/><text x="322" y="1085" font-size="12">10 kΩ</text><text x="457" y="1055" font-size="13">Q8: NPN</text><text x="457" y="1074" font-size="12">2N3904</text><path d="M445,1092 L445,1145" class="wire"/><path d="M427,1145 L463,1145" class="wire"/><path d="M433,1151 L457,1151" class="wire"/><path d="M440,1157 L450,1157" class="wire"/><text x="428" y="1183" font-size="12">GND</text><text x="25" y="1268" font-size="14">Drive A/B to 0 V or +3.3 V. Do not float inputs. Use a high-impedance output probe.</text><text x="25" y="1291" font-size="14">PNP devices form the series pull-up; NPN devices form the parallel pull-down.</text><text x="25" y="1314" font-size="14">Conceptual design: DC margins, loading, and switching current require simulation before building.</text><text x="25" y="1337" font-size="14">Check manufacturer pinouts. Complementary BJT stages draw base current; they are not CMOS.</text></svg>
