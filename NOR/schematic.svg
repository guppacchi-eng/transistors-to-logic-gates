<svg xmlns="http://www.w3.org/2000/svg" width="1150" height="790" viewBox="0 0 1150 790"><rect width="100%" height="100%" fill="white"/><style>text{font-family:Arial,sans-serif;fill:#17324d}.wire{stroke:#17324d;stroke-width:2;fill:none}.component{stroke:#17324d;stroke-width:2;fill:white}</style><text x="25" y="34" font-size="25">NOR gate — complementary NPN + PNP transistors</text><text x="25" y="64" font-size="15">Supply: +3.3 V DC | NPN: 2N3904 | PNP: 2N3906 | Every base resistor: 10 kΩ</text><text x="25" y="88" font-size="14">Matching net labels connect electrically. All grounds connect to supply negative.</text><rect x="25" y="110" width="535" height="540" rx="8" fill="#f7fafc" stroke="#c5d4e0"/><text x="40" y="135" font-size="17">Stage 1: Y = NOT (A OR B)</text><path d="M325,165 L325,188" class="wire"/><text x="340" y="175" font-size="15">+3.3 V</text><path d="M305,197 L305,243" class="wire"/><path d="M325,188 L305,208" class="wire"/><path d="M305,232 L325,252" class="wire"/><path d="M305,208 L319,202 L312,195 Z" fill="#17324d"/><text x="165" y="204" font-size="16">A</text><path d="M165,220 L200,220" class="wire"/><rect x="200" y="214" width="68" height="12" class="component"/><path d="M268,220 L305,220" class="wire"/><text x="202" y="245" font-size="12">10 kΩ</text><text x="337" y="215" font-size="13">Q1: PNP</text><text x="337" y="234" font-size="12">2N3906</text><path d="M325,252 L325,288" class="wire"/><path d="M305,297 L305,343" class="wire"/><path d="M325,288 L305,308" class="wire"/><path d="M305,332 L325,352" class="wire"/><path d="M305,308 L319,302 L312,295 Z" fill="#17324d"/><text x="165" y="304" font-size="16">B</text><path d="M165,320 L200,320" class="wire"/><rect x="200" y="314" width="68" height="12" class="component"/><path d="M268,320 L305,320" class="wire"/><text x="202" y="345" font-size="12">10 kΩ</text><text x="337" y="315" font-size="13">Q2: PNP</text><text x="337" y="334" font-size="12">2N3906</text><path d="M325,352 L325,405" class="wire"/><path d="M210,405 L515,405" class="wire"/><circle cx="325" cy="405" r="3" fill="#17324d"/><text x="480" y="393" font-size="18">Y</text><circle cx="210" cy="405" r="3" fill="#17324d"/><path d="M210,405 L210,468" class="wire"/><path d="M190,477 L190,523" class="wire"/><path d="M210,468 L190,488" class="wire"/><path d="M190,512 L210,532" class="wire"/><path d="M210,532 L197,525 L205,518 Z" fill="#17324d"/><text x="50" y="484" font-size="16">A</text><path d="M50,500 L85,500" class="wire"/><rect x="85" y="494" width="68" height="12" class="component"/><path d="M153,500 L190,500" class="wire"/><text x="87" y="525" font-size="12">10 kΩ</text><text x="222" y="495" font-size="13">Q3: NPN</text><text x="222" y="514" font-size="12">2N3904</text><path d="M210,532 L210,585" class="wire"/><path d="M192,585 L228,585" class="wire"/><path d="M198,591 L222,591" class="wire"/><path d="M205,597 L215,597" class="wire"/><text x="193" y="623" font-size="12">GND</text><circle cx="445" cy="405" r="3" fill="#17324d"/><path d="M445,405 L445,468" class="wire"/><path d="M425,477 L425,523" class="wire"/><path d="M445,468 L425,488" class="wire"/><path d="M425,512 L445,532" class="wire"/><path d="M445,532 L432,525 L440,518 Z" fill="#17324d"/><text x="285" y="484" font-size="16">B</text><path d="M285,500 L320,500" class="wire"/><rect x="320" y="494" width="68" height="12" class="component"/><path d="M388,500 L425,500" class="wire"/><text x="322" y="525" font-size="12">10 kΩ</text><text x="457" y="495" font-size="13">Q4: NPN</text><text x="457" y="514" font-size="12">2N3904</text><path d="M445,532 L445,585" class="wire"/><path d="M427,585 L463,585" class="wire"/><path d="M433,591 L457,591" class="wire"/><path d="M440,597 L450,597" class="wire"/><text x="428" y="623" font-size="12">GND</text><text x="25" y="708" font-size="14">Drive A/B to 0 V or +3.3 V. Do not float inputs. Use a high-impedance output probe.</text><text x="25" y="731" font-size="14">PNP devices form the series pull-up; NPN devices form the parallel pull-down.</text><text x="25" y="754" font-size="14">Conceptual design: DC margins, loading, and switching current require simulation before building.</text><text x="25" y="777" font-size="14">Check manufacturer pinouts. Complementary BJT stages draw base current; they are not CMOS.</text></svg>
