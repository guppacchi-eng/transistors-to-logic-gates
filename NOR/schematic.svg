<svg xmlns="http://www.w3.org/2000/svg" width="1150" height="545" viewBox="0 0 1150 545"><rect width="100%" height="100%" fill="white"/><style>text{font-family:Arial,sans-serif;fill:#17324d}.wire{stroke:#17324d;stroke-width:2;fill:none}.component{stroke:#17324d;stroke-width:2;fill:white}</style><text x="25" y="35" font-size="25">NOR gate — NPN resistor-transistor logic</text><text x="25" y="65" font-size="15">Supply: +5 V DC | Q: 2N3904 | RC: 4.7 kΩ | RB: 22 kΩ</text><text x="25" y="88" font-size="14">Matching net labels are electrically connected. All ground symbols share supply negative.</text><rect x="25" y="115" width="535" height="310" rx="8" fill="#f7fafc" stroke="#c5d4e0"/><text x="40" y="140" font-size="17">Stage 1: Y = NOT (A OR B)</text><path d="M210,160 L210,170" class="wire"/><text x="222" y="166" font-size="15">+5 V</text><path d="M210,170 L210,178" class="wire"/><rect x="204" y="178" width="12" height="29" class="component"/><path d="M210,207 L210,215" class="wire"/><text x="225" y="197" font-size="13">4.7 kΩ</text><path d="M210,215 L515,215" class="wire"/><circle cx="210" cy="215" r="3" fill="#17324d"/><text x="465" y="205" font-size="18">Y</text><path d="M210,215 L210,285" class="wire"/><path d="M210,285 L190,298" class="wire"/><path d="M190,287 L190,333" class="wire"/><path d="M190,322 L210,342" class="wire"/><path d="M197,335 L210,342 L205,328 Z" fill="#17324d"/><path d="M210,342 L210,375" class="wire"/><path d="M172,310 L190,310" class="wire"/><path d="M95,310 L103,310" class="wire"/><rect x="103" y="304" width="61" height="12" class="component"/><path d="M164,310 L172,310" class="wire"/><path d="M60,310 L95,310" class="wire"/><text x="60" y="294" font-size="16">A</text><text x="98" y="335" font-size="12">22 kΩ</text><text x="220" y="304" font-size="14">Q1</text><text x="220" y="323" font-size="12">2N3904</text><path d="M192,375 L228,375" class="wire"/><path d="M198,381 L222,381" class="wire"/><path d="M205,387 L215,387" class="wire"/><text x="193" y="407" font-size="12">GND</text><circle cx="445" cy="215" r="3" fill="#17324d"/><path d="M445,215 L445,285" class="wire"/><path d="M445,285 L425,298" class="wire"/><path d="M425,287 L425,333" class="wire"/><path d="M425,322 L445,342" class="wire"/><path d="M432,335 L445,342 L440,328 Z" fill="#17324d"/><path d="M445,342 L445,375" class="wire"/><path d="M407,310 L425,310" class="wire"/><path d="M330,310 L338,310" class="wire"/><rect x="338" y="304" width="61" height="12" class="component"/><path d="M399,310 L407,310" class="wire"/><path d="M295,310 L330,310" class="wire"/><text x="295" y="294" font-size="16">B</text><text x="333" y="335" font-size="12">22 kΩ</text><text x="455" y="304" font-size="14">Q2</text><text x="455" y="323" font-size="12">2N3904</text><path d="M427,375 L463,375" class="wire"/><path d="M433,381 L457,381" class="wire"/><path d="M440,387 L450,387" class="wire"/><text x="428" y="407" font-size="12">GND</text><text x="25" y="480" font-size="14">Logic: LOW = 0 V; HIGH = +5 V. Drive inputs actively; do not leave them floating.</text><text x="25" y="503" font-size="14">Outputs are resistively pulled up: use a high-impedance probe; no direct LED or heavy load.</text><text x="25" y="526" font-size="14">Conceptual design: verify electrical behavior in simulation and check transistor pinouts before wiring.</text></svg>
